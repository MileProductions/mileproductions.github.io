<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kotkowy Domek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#ff8fc1;--pink-d:#e2558f;--pink-l:#ffe1ef;
  --lav:#c9b2ff;--lav-l:#efe7ff;--mint:#9fe8d0;--peach:#ffc9a3;
  --cream:#fff8f3;--ink:#4a2a5a;--gold:#ffcf4a;
  --font: ui-rounded, "SF Pro Rounded", "Baloo 2", system-ui, sans-serif;
}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:var(--font);color:var(--ink);
  background:
   radial-gradient(circle at 20% 15%,rgba(255,255,255,.7) 0 2px,transparent 3px) 0 0/90px 90px,
   radial-gradient(circle at 70% 60%,rgba(255,255,255,.55) 0 1.5px,transparent 2.5px) 0 0/70px 70px,
   linear-gradient(160deg,#f3e6ff 0%,#ffe0f0 45%,#ffeedd 100%);}
button{font-family:inherit;color:inherit}
input,textarea,select{font-family:inherit;-webkit-user-select:text;user-select:text}
#bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#bg span{position:absolute;opacity:.45;animation:floaty 9s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-26px) rotate(12deg)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:80;width:100%;height:100%}

.scene{position:absolute;inset:0;display:none;flex-direction:column;z-index:1}
.scene.active{display:flex;animation:sceneIn .5s cubic-bezier(.2,1.3,.4,1)}
@keyframes sceneIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}

.pill{font-size:clamp(18px,2vw,26px);font-weight:800;padding:.6em 1.4em;border-radius:999px;border:none;cursor:pointer;
  background:linear-gradient(#ff9fcb,#ff6aa8);color:#fff;box-shadow:0 6px 0 #d94c8a,0 10px 24px rgba(217,76,138,.3);transition:transform .1s}
.pill:active{transform:translateY(4px);box-shadow:0 2px 0 #d94c8a}
.pill.lav{background:linear-gradient(#cdb6ff,#a184ff);box-shadow:0 6px 0 #7a5cd6}
.pill.mint{background:linear-gradient(#a6f0d6,#4fd1a5);box-shadow:0 6px 0 #2ea47d}
.round-btn{width:58px;height:58px;border-radius:50%;border:none;background:#fff;font-size:28px;cursor:pointer;
  box-shadow:0 5px 0 #e9cfe2,0 8px 18px rgba(120,60,120,.15);flex:none}
.round-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #e9cfe2}

/* cat */
.cat{overflow:visible;display:block}
.cat .tail{transform-origin:118px 140px;animation:wag 1.8s ease-in-out infinite}
.cat .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
.cat .head{transform-box:fill-box;transform-origin:50% 95%;animation:tilt 6s ease-in-out infinite}
@keyframes wag{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(14deg)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes tilt{0%,100%{transform:rotate(0)}30%{transform:rotate(-5deg)}60%{transform:rotate(4deg)}}
.catbox{display:flex;justify-content:center}
.catbox.hop .cat{animation:hop .7s cubic-bezier(.3,1.8,.5,1)}
.catbox.shake .cat{animation:shake .45s}
@keyframes hop{0%{transform:translateY(0)}35%{transform:translateY(-40px) scale(1.05,.95)}70%{transform:translateY(0) scale(1.08,.9)}100%{transform:none}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-10px) rotate(-4deg)}40%{transform:translateX(10px) rotate(4deg)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}

.bubble{background:#fff;border-radius:26px;padding:14px 20px;font-size:clamp(18px,2vw,27px);font-weight:700;line-height:1.25;position:relative;
  box-shadow:0 8px 24px rgba(140,70,140,.15);border:3px solid #ffd3e8;text-align:center;min-height:2.2em}
.bubble::after{content:"";position:absolute;left:50%;bottom:-16px;margin-left:-14px;border:14px solid transparent;border-top-color:#fff;border-bottom:0}
.bubble.pop{animation:bpop .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes bpop{from{transform:scale(.85)}to{transform:none}}

/* start */
#start{align-items:center;justify-content:center;gap:16px;text-align:center}
#start h1{font-size:clamp(48px,7vw,96px);margin:0;line-height:1;color:var(--pink-d);
  text-shadow:0 4px 0 #fff,0 8px 0 #ffc2dd,0 14px 24px rgba(226,85,143,.25);letter-spacing:.5px}
#start p{margin:0;font-size:clamp(18px,2vw,26px);font-weight:700;opacity:.8}
.langpick{display:flex;gap:10px;justify-content:center}
.langpick button{font-size:22px;font-weight:800;padding:10px 18px;border-radius:999px;border:3px solid #fff;background:rgba(255,255,255,.6);cursor:pointer}
.langpick button.on{background:#fff;border-color:var(--pink);box-shadow:0 4px 0 #ffc2dd}

/* home */
.topbar{display:flex;align-items:center;gap:14px;padding:14px 22px}
.logo{font-size:clamp(24px,2.8vw,38px);font-weight:800;color:var(--pink-d);cursor:default;position:relative;padding:4px 10px;border-radius:16px;
  background:linear-gradient(90deg,rgba(255,255,255,.8) var(--hold,0%),transparent var(--hold,0%))}
.spacer{flex:1}
.gemcount{background:#fff;border-radius:999px;padding:8px 18px;font-size:24px;font-weight:800;box-shadow:0 4px 0 #e9cfe2;display:flex;align-items:center;gap:6px}
.homewrap{flex:1;display:flex;align-items:center;justify-content:center;gap:2vw;padding:0 2vw 2vh;min-height:0}
.host{width:min(22vw,260px);display:flex;flex-direction:column;align-items:center;gap:22px}
.house{width:min(70vw,1050px);display:flex;flex-direction:column;filter:drop-shadow(0 18px 30px rgba(160,70,140,.22))}
.roof{height:min(15vh,120px);position:relative;margin:0 -24px}
.roof::before{content:"";position:absolute;inset:0;clip-path:polygon(50% 0,100% 100%,0 100%);
  background:repeating-linear-gradient(90deg,#ff8fc1 0 40px,#ff7ab8 40px 80px)}
.roof .win{position:absolute;left:50%;top:42%;transform:translateX(-50%);width:min(9vh,70px);height:min(9vh,70px);border-radius:50%;
  background:#fff6fb;border:6px solid #fff;display:flex;align-items:center;justify-content:center;font-size:min(5vh,38px);animation:beat 1.6s ease-in-out infinite}
@keyframes beat{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.1)}}
.rooms{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:min(27vh,210px);gap:14px;padding:16px;background:#fff3f9;
  border:8px solid #ff9fcb;border-top:none;border-radius:0 0 30px 30px}
.room{border:4px solid #fff;border-radius:22px;cursor:pointer;position:relative;overflow:hidden;
  background:radial-gradient(circle,rgba(255,255,255,.55) 0 3px,transparent 4px) 0 0/26px 26px,var(--c);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:inset 0 -14px 0 rgba(255,255,255,.45),0 6px 14px rgba(150,80,140,.15);
  transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.room:hover{transform:translateY(-6px) rotate(-1.5deg)}
.room:nth-child(even):hover{transform:translateY(-6px) rotate(1.5deg)}
.room.enter{animation:enter .45s ease-in forwards}
@keyframes enter{to{transform:scale(1.25);opacity:0}}
.room .ico{font-size:min(7vh,64px);animation:bob 3s ease-in-out infinite}
.room:nth-child(2n) .ico{animation-delay:-1.2s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.room .rname{font-weight:800;font-size:clamp(15px,1.55vw,22px);text-align:center;line-height:1.1;padding:0 6px}
.room .sub{font-size:clamp(12px,1.1vw,16px);font-weight:700;opacity:.65}
.room .badge{position:absolute;top:8px;right:10px;background:#fff;border-radius:999px;padding:2px 10px;font-weight:800;font-size:15px}

/* game */
.gbar{display:flex;align-items:center;gap:14px;padding:12px 20px}
.gbar h2{margin:0;font-size:clamp(22px,2.6vw,34px);font-weight:800;color:var(--pink-d);flex:1}
.dots{display:flex;gap:8px}
.dots i{width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid #ffc2dd;display:block}
.dots i.on{background:var(--pink);border-color:#fff;box-shadow:0 0 0 3px var(--pink)}
.dots i.cur{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.25)}}
.gmain{flex:1;display:flex;min-height:0;padding:0 20px;gap:16px}
.guide{width:min(23vw,270px);display:flex;flex-direction:column;justify-content:center;gap:24px;flex:none}
.stage{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-width:0}
#kbWrap{padding:8px 0 14px;display:flex;justify-content:center}

/* keyboard */
.kb{--u:min(3.9vw,5.6vh,52px);background:linear-gradient(#e6e1ea,#d6d0dc);padding:calc(var(--u)*.16);border-radius:calc(var(--u)*.3);
  display:flex;flex-direction:column;gap:calc(var(--u)*.1);box-shadow:0 10px 24px rgba(90,60,110,.2)}
.kb.big{--u:min(5vw,7vh,68px)}
.kb .row{display:flex;gap:calc(var(--u)*.1);justify-content:center}
.key{width:var(--u);height:var(--u);border-radius:calc(var(--u)*.18);background:#fbfbfd;box-shadow:0 3px 0 #b9b3c0;display:flex;align-items:center;justify-content:center;
  font-size:calc(var(--u)*.42);font-weight:700;color:#4c4552;transition:transform .08s,background .15s;position:relative}
.key.w15{width:calc(var(--u)*1.5)}.key.w2{width:calc(var(--u)*2.1)}.key.space{width:calc(var(--u)*5.6)}
.key.sm{font-size:calc(var(--u)*.34)}
.key.press{transform:translateY(3px);box-shadow:0 0 0 #b9b3c0;background:#ffe1ef}
.key.hint{background:#ffd84a;box-shadow:0 3px 0 #d4a600,0 0 0 4px #fff,0 0 22px 6px rgba(255,200,40,.9);animation:keyglow .9s ease-in-out infinite;z-index:2}
@keyframes keyglow{50%{transform:scale(1.12)}}
.arrows{display:flex;flex-direction:column;gap:2px}
.arrows .key{height:calc(var(--u)*.49);font-size:calc(var(--u)*.3)}

/* tiles */
.tiles{display:flex;gap:min(1vw,12px);flex-wrap:wrap;justify-content:center;align-items:flex-end}
.tile{--w:min(7.2vw,10vh,92px);width:var(--w);height:calc(var(--w)*1.18);border-radius:20px;background:#fff;border:4px dashed #d8c5ff;
  display:flex;align-items:center;justify-content:center;font-size:calc(var(--w)*.72);font-weight:800;position:relative;transition:background .2s}
.tiles.small .tile{--w:min(4.6vw,7vh,60px);border-radius:14px;border-width:3px}
.tile .gh{color:rgba(74,42,90,.28)}
.tile .gh.hintgh{color:#e8a600;animation:pulse 1s infinite}
.tile.cur{border-color:var(--pink);border-style:solid;box-shadow:0 0 0 5px rgba(255,143,193,.25);animation:curb 1.2s ease-in-out infinite}
@keyframes curb{50%{transform:translateY(-6px)}}
.tile.done{border-style:solid;border-color:#fff;animation:tpop .4s cubic-bezier(.2,1.8,.4,1)}
.tile.done .gh{color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.12)}
@keyframes tpop{0%{transform:scale(.6) rotate(-10deg)}100%{transform:none}}
.tile.sp{width:calc(var(--w)*.45);border:none;background:transparent}
.tile.sp.cur{border-bottom:5px solid var(--pink);border-radius:0;box-shadow:none}
.tile.given{border:4px solid #fff;background:#f6efff}
.tile.given .gh{color:var(--ink)}
.tile.magic{border-color:#ffd84a}
.tile .lab{position:absolute;bottom:-1.6em;font-size:15px;font-weight:800;color:#b07cff;white-space:nowrap}
.gapgroup{display:flex;gap:4px;padding:6px;border-radius:24px;background:rgba(255,216,74,.3);position:relative}
.gapgroup::before{content:"🎀";position:absolute;top:-30px;left:50%;transform:translateX(-50%);font-size:32px}
.glow .tile{box-shadow:0 0 18px 4px rgba(255,215,80,.8)}
.chips{display:flex;gap:16px;justify-content:center;margin-bottom:22px}
.chip{font-size:min(5vw,7vh,54px);font-weight:800;background:#fff;border-radius:22px;padding:2px 26px;box-shadow:0 5px 0 #e6d2f5;border:3px solid #efe2ff}
.chip.glowc{border-color:#ffd84a;animation:pulse 1.2s infinite}

/* letters */
.kitchen{display:flex;align-items:center;gap:6vw}
.lettercard{background:#fff;border-radius:36px;padding:10px 40px 20px;box-shadow:0 10px 0 #ffd7bf,0 18px 30px rgba(200,100,60,.18);border:5px solid #ffe6d6;text-align:center}
.lettercard b{display:block;font-size:min(22vh,16vw,210px);line-height:1;color:#ff7a59}
.lettercard i{font-style:normal;font-size:min(7vh,56px);font-weight:800;color:#c98b6c;background:#fff4ec;border-radius:14px;padding:0 16px}
.pop-in{animation:popin .5s cubic-bezier(.2,1.7,.4,1)}
@keyframes popin{from{transform:scale(.3) rotate(-15deg);opacity:0}}
.pot{position:relative;text-align:center}
.pot .potbody{font-size:min(20vh,170px);line-height:1}
.pot .steam{font-size:min(7vh,50px);opacity:.7;animation:bob 2s infinite}
.flyer{position:absolute;left:50%;top:40%;font-size:60px;opacity:0;pointer-events:none}
.flyer.go{animation:fly .8s ease-in forwards}
@keyframes fly{0%{opacity:1;transform:translate(-260px,-160px) scale(1.4) rotate(0)}100%{opacity:0;transform:translate(-50%,10px) scale(.5) rotate(360deg)}}

/* words */
.wordgame,.sentgame{display:flex;flex-direction:column;align-items:center;gap:4vh}
.pic{font-size:min(20vh,180px);line-height:1;filter:grayscale(calc(1 - var(--p))) drop-shadow(0 10px 14px rgba(0,0,0,.12));
  transform:scale(calc(.8 + var(--p)*.3));transition:filter .4s,transform .4s}
.pic.yay{animation:yay .8s}
@keyframes yay{30%{transform:scale(1.3) rotate(-8deg)}60%{transform:scale(1.15) rotate(8deg)}}
.sentpic{font-size:min(14vh,120px);letter-spacing:12px}
.sentpic.dance{animation:yay .8s 2}

/* free */
.freegame{width:100%;height:100%;display:flex;flex-direction:column;gap:12px;padding:6px 0}
.paper{flex:1;background:#fff;border-radius:28px;padding:20px 26px;overflow:auto;font-size:min(9vh,64px);font-weight:800;line-height:1.3;
  background-image:repeating-linear-gradient(transparent 0 calc(1.3em - 3px),#f3e3f0 calc(1.3em - 3px) 1.3em);box-shadow:0 8px 24px rgba(140,70,140,.12);word-break:break-word}
.paper .fl{display:inline-block;animation:flpop .35s cubic-bezier(.2,1.8,.4,1);transform:rotate(var(--r))}
@keyframes flpop{from{transform:scale(2.2) translateY(-30px);opacity:0}}
.paper .poof{animation:poof .25s forwards}
@keyframes poof{to{transform:scale(0) rotate(90deg);opacity:0}}
.paper .sp{display:inline-block;width:.4em}
.freebtns{display:flex;gap:14px;justify-content:center}

/* garden */
.field{position:relative;width:100%;height:100%;border-radius:30px;background:linear-gradient(#e6fbff,#e9fff3 60%,#c9f2d9);overflow:hidden;box-shadow:inset 0 -30px 0 #b5ebc9}
.bfly{position:absolute;font-size:min(10vh,80px);background:none;border:none;cursor:pointer;transform:translate(-50%,-50%);transition:transform .15s;padding:10px}
.bfly:hover{transform:translate(-50%,-50%) scale(1.15)}
.bfly.caught{animation:caught .5s forwards;pointer-events:none}
@keyframes caught{to{transform:translate(-50%,-50%) scale(2);opacity:0}}
.field.drag{display:flex;align-items:center;justify-content:space-around}
.dragcat{cursor:grab;touch-action:none;z-index:3;filter:drop-shadow(0 10px 10px rgba(0,0,0,.12))}
.dragcat.grab{cursor:grabbing;filter:drop-shadow(0 26px 18px rgba(0,0,0,.2))}
.basket{font-size:min(24vh,190px);transition:transform .3s}
.basket.happy{animation:yay .8s}
.gift{font-size:min(28vh,220px);background:none;border:none;cursor:pointer;line-height:1}
.gift.wig{animation:shake .4s}
.field.center{display:flex;align-items:center;justify-content:center;flex-direction:column}
.maze{display:grid;gap:6px;background:#bdeccd;padding:10px;border-radius:24px}
.cell{width:min(8vw,8.3vh,84px);height:min(8vw,8.3vh,84px);border-radius:16px;background:#fffdf4;display:flex;align-items:center;justify-content:center;font-size:min(6vw,7vh,58px)}
.cell.wall{background:#9fdcb3}
.cell .me{transition:transform .15s}
.jumper{transition:none}
.jumper.jump{animation:jump .6s cubic-bezier(.3,.9,.5,1)}
@keyframes jump{40%{transform:translateY(-34vh) rotate(-10deg)}100%{transform:none}}
.jstars{font-size:min(8vh,60px);letter-spacing:8px;margin-top:2vh}
.clouds{position:absolute;top:8%;font-size:min(10vh,80px);width:100%;display:flex;justify-content:space-around;opacity:.9}

/* overlays */
.overlay{position:fixed;inset:0;background:rgba(90,40,110,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:50}
.overlay.on{display:flex}
.card{background:#fff;border-radius:36px;padding:34px 44px;text-align:center;animation:popin .5s cubic-bezier(.2,1.6,.4,1);box-shadow:0 30px 60px rgba(90,40,110,.3);max-width:92vw}
.card h2{margin:6px 0 18px;font-size:clamp(28px,3.4vw,46px);color:var(--pink-d)}
.bigGem{animation:spinGem 2.4s ease-in-out infinite;display:inline-block}
@keyframes spinGem{0%,100%{transform:rotate(-10deg) scale(1)}50%{transform:rotate(10deg) scale(1.12)}}
.card .row{display:flex;gap:16px;justify-content:center;margin-top:22px;flex-wrap:wrap}
.stickerNew{font-size:64px;display:inline-block;animation:popin .6s .4s both cubic-bezier(.2,1.7,.4,1)}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#fff;border-radius:999px;padding:10px 24px;font-size:24px;font-weight:800;z-index:70;
  box-shadow:0 10px 30px rgba(140,70,140,.25);animation:popin .5s cubic-bezier(.2,1.6,.4,1);display:flex;align-items:center;gap:10px}

/* jewels */
.jmain{flex:1;display:flex;align-items:center;justify-content:center;gap:3vw;padding:0 3vw 3vh;min-height:0}
.bracelet{width:min(44vh,40vw,420px)}
.bracelet svg{width:100%;height:auto;overflow:visible}
.bracelet [data-g]{cursor:pointer}
.album{background:#fff;border-radius:30px;padding:18px 24px;width:min(30vw,380px);box-shadow:0 10px 26px rgba(140,70,140,.12);max-height:70vh;overflow:auto}
.album h3{margin:4px 0 10px;color:var(--pink-d);font-size:24px}
.stk{display:flex;flex-wrap:wrap;gap:6px;font-size:40px;min-height:50px}
.stk span{animation:popin .4s both}
.mini{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}

/* parent */
.ppanel{text-align:left;width:min(860px,94vw);max-height:90vh;overflow:auto;padding:26px 32px;font-size:17px}
.ppanel h2{text-align:left;margin:0 0 6px}
.ppanel h3{margin:22px 0 8px;color:#8a5cd6;font-size:19px}
.prow{display:flex;align-items:center;gap:12px;margin:8px 0;flex-wrap:wrap}
.prow label{min-width:190px;font-weight:700}
.ppanel input[type=text],.ppanel select,.ppanel textarea{font-size:17px;padding:8px 12px;border-radius:12px;border:2px solid #e6d6f5;background:#fdfaff}
.ppanel textarea{width:100%;height:90px}
.ppanel .small{font-size:14px;opacity:.75}
.lvl{display:inline-flex;align-items:center;gap:8px;background:#f6efff;border-radius:999px;padding:4px 6px}
.lvl button{width:32px;height:32px;border-radius:50%;border:none;background:#fff;font-size:20px;font-weight:800;cursor:pointer}
.miss{display:flex;gap:8px;flex-wrap:wrap}
.miss span{background:#fff1f6;border-radius:10px;padding:4px 10px;font-weight:800}
.sbtn{font-size:16px;font-weight:800;padding:8px 16px;border-radius:999px;border:2px solid #e6d6f5;background:#fff;cursor:pointer}
.sbtn.danger{border-color:#ffb3c7;color:#d23c6b}
.gatecard input{font-size:34px;width:140px;text-align:center;border-radius:16px;border:3px solid #e6d6f5;padding:6px}
.holdbtn{background:linear-gradient(90deg,#ffd6ea var(--hold,0%),#fff var(--hold,0%));border:3px solid #ffd6ea;border-radius:999px;padding:10px 22px;font-size:18px;font-weight:800;cursor:pointer;margin-top:18px}
.zzz{font-size:46px;animation:floaty 2.5s infinite}
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="fx"></canvas>

<!-- START -->
<section class="scene active" id="start">
  <div class="catbox" id="startCat"></div>
  <h1>Kotkowy Domek</h1>
  <p id="startSub">Nauka pisania z kotkami</p>
  <div class="langpick" id="startLang">
    <button data-lang="pl">🇵🇱 Polski</button>
    <button data-lang="en">🇬🇧 English</button>
  </div>

const HAS_TTS='speechSynthesis' in window;
let voices=[];
function loadVoices(){if(HAS_TTS)voices=speechSynthesis.getVoices()}

const voicesFor=lang=>{if(!voices.length)loadVoices();return voices.filter(v=>v.lang.toLowerCase().replace('_','-').startsWith(lang))};
function voiceScore(v,lang){const n=v.name;let s=0;
  if(/premium/i.test(n))s+=60;if(/enhanced|rozszerz|ulepsz/i.test(n))s+=50;
  if(/^Google/i.test(n))s+=40;if(/natural|neural|online/i.test(n))s+=45;
  if(lang==='pl'&&/Zosia/i.test(n))s+=20;if(lang==='en'&&/Samantha|Ava|Zoe|Serena|Karen|Daniel/i.test(n))s+=20;
  if(/Grandma|Grandpa|Eddy|Flo|Reed|Rocko|Sandy|Shelley|Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Fred|Junior|Kathy|Ralph/i.test(n))s-=80;
  return s}
function pickVoice(lang){
  const list=voicesFor(lang);const want=S.settings['voice_'+lang];
  if(want){const v=list.find(v=>v.name===want);if(v)return v}
  return list.slice().sort((a,b)=>voiceScore(b,lang)-voiceScore(a,lang))[0]||null;
}
let sayId=0;
function say(text,lang=S.lang,o={}){
  if(!HAS_TTS||!text||S.settings.voice<=0)return Promise.resolve();
  const id=++sayId;
  return new Promise(res=>{
    let done=false;const fin=()=>{if(!done){done=true;res()}};
    const go=()=>{
      if(id!==sayId)return fin();
      loadVoices();const u=new SpeechSynthesisUtterance(text.replace(/[„”“]/g,''));const v=pickVoice(lang);if(v)u.voice=v;else noVoiceWarn(lang);
      u.lang=lang==='pl'?'pl-PL':'en-US';u.rate=S.settings.rate*(o.rate||1);u.volume=S.settings.voice;u.pitch=o.pitch||1.15;
      u.onend=fin;u.onerror=fin;setTimeout(fin,1500+text.length*110);speechSynthesis.speak(u);
    };
    if(speechSynthesis.speaking||speechSynthesis.pending){speechSynthesis.cancel();setTimeout(go,80)}else go();
  });
}

function fx(){
  cx.clearRect(0,0,innerWidth,innerHeight);parts=parts.filter(p=>p.life>0&&p.y<innerHeight+40);
  for(const p of parts){p.vy+=p.g*.6;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.life-=.7;p.r+=p.vr;
    cx.save();cx.globalAlpha=Math.min(1,p.life/25);cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.font=`${p.s*1.5}px sans-serif`;cx.textAlign='center';cx.textBaseline='middle';cx.fillText(p.sh,0,0);cx.restore()}
  if(parts.length)requestAnimationFrame(fx);else{fxOn=false;cx.clearRect(0,0,innerWidth,innerHeight)}
}

  ];
  const k=([lab,code,cls,ch])=>`<div class="key ${cls}" data-code="${code}" data-ch="${ch==='"'?'':ch}">${lab}</div>`;

/* ================= HOLD helper ================= */
function holdable(elm,ms,cb){let t0=0,raf=0;
  const stop=()=>{cancelAnimationFrame(raf);t0=0;elm.style.setProperty('--hold','0%')};
  const tick=ts=>{if(!t0)t0=ts;const p=Math.min(1,(ts-t0)/ms);elm.style.setProperty('--hold',(p*100)+'%');if(p>=1){stop();cb()}else raf=requestAnimationFrame(tick)};
  elm.addEventListener('pointerdown',e=>{e.preventDefault();stop();raf=requestAnimationFrame(tick)});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>elm.addEventListener(ev,stop));
}

  $('#pTest').onclick=()=>{readParent();say(S.lang==='pl'?`Cześć ${S.name}! Jestem Mruczka.`:`Hi ${S.name}! I am a kitty.`)};
  let resetArm=false;$('#pReset').onclick=e=>{if(!resetArm){resetArm=true;e.target.textContent='Na pewno? Kliknij jeszcze raz';return}
    const keep={settings:S.settings,name:S.name,lang:S.lang,custom:S.custom};S=merge(JSON.parse(JSON.stringify(DEF)),keep);save();openParent()};
  $('#pClose').onclick=()=>{readParent();$('#parent').classList.remove('on');if(G.scene==='home')renderHome()};
}
function readParent(){
  S.name=($('#pName').value.trim()||'Roch').slice(0,14);S.settings.limit=+$('#pLimit').value;S.settings.sfx=+$('#pSfx').value;S.settings.voice=+$('#pVoice').value;S.settings.rate=+$('#pRate').value;
  S.custom.pl=$('#pCustPl').value;['pl','en'].forEach(lg=>{const sel=$('#pV_'+lg);if(sel)S.settings['voice_'+lg]=sel.value});S.custom.en=$('#pCustEn').value;save();
}

/* ================= TIME LIMIT ================= */
let started=false,breakOn=false,session=0;
setInterval(()=>{
  if(!started||breakOn||document.hidden)return;session++;S.stats.seconds++;const d=today();S.stats.days[d]=(S.stats.days[d]||0)+1;
  if(session%10===0)save();const lim=S.settings.limit;if(lim>0&&session>=lim*60)showBreak();
},1000);
function showBreak(){breakOn=true;stopAll();$('#breakCat').innerHTML=catSVG('#ffa8cf','#e2558f',170);$('#breakText').textContent=t('breakText');$('#breakHold').textContent=t('parentHold');
  $('#break').classList.add('on');say(t('breakText'));save()}
holdable($('#breakHold'),3000,()=>{breakOn=false;session=0;$('#break').classList.remove('on');goHome()});

/* ================= INIT ================= */
$('#startCat').innerHTML=catSVG('#ffa8cf','#e2558f',Math.min(230,innerHeight*.28));
$('#homeCat').innerHTML=catSVG('#ffa8cf','#e2558f',Math.min(200,innerHeight*.24));
renderLang();$('#startSub').textContent=t('sub');$('#startBtn').textContent=t('start');
addEventListener('beforeunload',save);
})();
</script>
</body>
</html>
